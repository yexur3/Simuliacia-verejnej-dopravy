name: Collect departures

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Check API connection
        shell: bash
        run: |
          URL="https://opendata.banskabystrica.sk/api/datasets/v1/public-transport/stops/list"

          echo "=== Звичайне підключення ==="
          curl -sS -v \
            --connect-timeout 15 \
            --max-time 30 \
            -H "Content-Type: application/json" \
            --data '{}' \
            --output /dev/null \
            --write-out '\nHTTP: %{http_code}, IP: %{remote_ip}\n' \
            "$URL" || true

          echo "=== Тільки IPv4 ==="
          curl -4 -sS -v \
            --connect-timeout 15 \
            --max-time 30 \
            -H "Content-Type: application/json" \
            --data '{}' \
            --output /dev/null \
            --write-out '\nHTTP: %{http_code}, IP: %{remote_ip}\n' \
            "$URL" || true

      - name: Collect and verify data
        shell: bash
        run: |
          if [ ! -s collect_once.py ]; then
            echo "::error::collect_once.py відсутній або порожній"
            exit 1
          fi

          python -u collect_once.py

          if [ ! -f data/departures.json ]; then
            echo "::error::collect_once.py завершився, але data/departures.json не створено"
            echo "Робоча папка:"
            pwd
            echo "Розмір скрипта:"
            wc -c collect_once.py
            exit 1
          fi

          python -c 'import json; from pathlib import Path; p = Path("data/departures.json"); data = json.loads(p.read_text(encoding="utf-8")); print(f"Файл JSON перевірено. Записів: {len(data)}")'

          ls -lh data/departures.json

      - name: Commit data
        shell: bash
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"

          git add data/departures.json

          if git diff --staged --quiet; then
            echo "Нових змін немає."
          else
            git commit -m "data: update departures"
            git push
          fi